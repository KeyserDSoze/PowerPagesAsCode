name: Deploy Power Pages

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "src/backend/**"
      - ".powerpages-site/**"
      - "scripts/**"
      - "powerpages.config.json"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment / Power Platform target
        required: true
        default: development
        type: choice
        options:
          - development
          - test
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: power-pages-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate and test
        run: |
          npm run check
          npm test

      - name: Build frontend and Server Logic snapshot
        run: npm run build

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Validate deployment variables
        shell: bash
        env:
          POWER_PLATFORM_ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          POWER_PLATFORM_TENANT_ID: ${{ vars.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ vars.POWER_PLATFORM_CLIENT_ID }}
        run: |
          test -n "$POWER_PLATFORM_ENVIRONMENT_URL" || (echo "Missing POWER_PLATFORM_ENVIRONMENT_URL" && exit 1)
          test -n "$POWER_PLATFORM_TENANT_ID" || (echo "Missing POWER_PLATFORM_TENANT_ID" && exit 1)
          test -n "$POWER_PLATFORM_CLIENT_ID" || (echo "Missing POWER_PLATFORM_CLIENT_ID" && exit 1)

      - name: Authenticate with GitHub OIDC
        shell: bash
        run: |
          pac auth create             --environment "${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}"             --tenant "${{ vars.POWER_PLATFORM_TENANT_ID }}"             --applicationId "${{ vars.POWER_PLATFORM_CLIENT_ID }}"             --githubFederated

      - name: Upload Code Site
        run: pac pages upload-code-site --rootPath .
