name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Repository doctor
        run: npm run doctor

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm run security:audit

      - name: Production build
        run: npm run build

      - name: Verify version manifest
        shell: bash
        run: |
          test -f dist/version.json || (echo "dist/version.json was not generated" && exit 1)
          APP_VERSION="$(npm run --silent version:print)"
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('dist/version.json')); if(v.version !== process.argv[1]) process.exit(1)" "$APP_VERSION"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
