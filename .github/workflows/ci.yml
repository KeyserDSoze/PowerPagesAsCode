name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository doctor
        run: npm run doctor

      - name: Rebrand script dry run
        run: |
          npm run rebrand -- \
            --name "PowerPagesAsCode" \
            --slug "power-pages-as-code" \
            --site-name "PowerPagesAsCode" \
            --pwa-name "Power Pages Field Service" \
            --short-name "Field Service" \
            --scope "@powerpages-as-code" \
            --cicd-app-name "power-pages-as-code-cicd" \
            --dry-run

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm run security:audit

      - name: Production build
        run: npm run build

      - name: Verify version manifest
        shell: bash
        run: |
          test -f dist/version.json || (echo "dist/version.json was not generated" && exit 1)
          APP_VERSION="$(npm run --silent version:print)"
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('dist/version.json')); if(v.version !== process.argv[1]) process.exit(1)" "$APP_VERSION"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  rebrand-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply representative rebrand
        run: |
          npm run rebrand -- \
            --name "Contoso Field Operations" \
            --slug "contoso-field-operations" \
            --site-name "Contoso Field Operations" \
            --pwa-name "Contoso Field Operations" \
            --short-name "Contoso Field" \
            --scope "@contoso" \
            --cicd-app-name "contoso-field-operations-cicd"

      - name: Verify source repository URL was not rebranded
        shell: bash
        run: grep -F "https://github.com/KeyserDSoze/PowerPagesAsCode.git" docs/00-getting-started.md

      - name: Install rebranded lockfile
        run: npm ci

      - name: Validate rebranded project
        run: |
          npm run brand:check
          npm run check
          npm test
          npm run build
